<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGEV II | Resource Library</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#183047;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#123653,#236b78);color:white;padding:40px max(20px,calc((100vw - 1100px)/2)) 34px}header h1{margin:0 0 8px;font-size:clamp(26px,4vw,40px)}header p{margin:0;opacity:.9}main{max-width:1100px;margin:auto;padding:28px 20px 60px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}input{flex:1;min-width:220px;border:1px solid #c9d6e0;border-radius:12px;padding:14px 16px;font:inherit;background:white}#count{font-size:13px;color:#526879}.group{margin:0 0 26px}.group h2{font-size:19px;margin:0 0 14px;display:flex;align-items:center;gap:9px}.group h2:before{content:'▸';color:#21818a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{display:flex;flex-direction:column;gap:9px;min-height:145px;background:white;border:1px solid #dce5ec;border-radius:15px;padding:20px;text-decoration:none;color:inherit;box-shadow:0 4px 16px #1830470a;transition:transform .15s,box-shadow .15s}.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 25px #18304720;outline:2px solid #58a6a9;outline-offset:2px}.card strong{font-size:17px;line-height:1.3}.card .desc{font-size:13px;color:#597080;flex:1}.card .open{font-size:13px;font-weight:700;color:#137681}.empty{padding:25px;text-align:center;color:#597080;background:white;border-radius:12px}footer{font-size:12px;color:#687e8c;margin-top:28px;line-height:1.6}code{background:#e5edf2;padding:2px 5px;border-radius:4px}@media(max-width:600px){header{padding:32px 20px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>PGEV II Resource Library</h1><p>One place for community information, tools, forms, and reports.</p></header>
<main>
<div class="toolbar"><input id="search" type="search" placeholder="Search resources or categories…" aria-label="Search resources"><span id="count"></span></div>
<div id="library"></div>
<footer>To add another website, open this HTML file in a text editor and add a new entry to the <code>resources</code> list near the bottom. Save and upload the updated file to GitHub Pages. All links open in a new tab.</footer>
</main>
<script>
// ===============================================================
// EDIT YOUR LINKS HERE. Copy one { ... } line to add a new website.
// category: folder name | title: display text | url: destination
// description: optional explanation shown below the title
// ===============================================================
const resources = [
  { category: "Governance & Community", title: "Restoration & Governance Discussion", url: "https://lexsch3-git.github.io/pgev2lib/index3.html", description: "Community restoration and governance discussions." },
  { category: "Finance & Planning", title: "Financial Sustainability Simulator", url: "https://lexsch3-git.github.io/pgevfinance/", description: "Explore financial sustainability scenarios." },
  { category: "Elections & Forms", title: "ELECOM Forms for HOA", url: "https://lexsch3-git.github.io/elecom", description: "Election committee forms and resources." },
  { category: "DHSUD Reports", title: "ELECOM Reports to DHSUD", url: "https://lexsch3-git.github.io/elecom/index2.html", description: "Election committee reporting resources." }
  // Example: ,{ category: "DHSUD Reports", title: "New Report", url: "https://example.com", description: "Short description" }
];
// ===============================================================
// Everything below works automatically. No need to edit it.
// ===============================================================
const library = document.getElementById('library');
const search = document.getElementById('search');
const count = document.getElementById('count');
function render(){
 const term=search.value.trim().toLowerCase();
 const filtered=resources.filter(r=>[r.category,r.title,r.description,r.url].some(v=>(v||'').toLowerCase().includes(term)));
 library.replaceChildren(); count.textContent=`${filtered.length} of ${resources.length} resources`;
 if(!filtered.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching resources found.';library.append(p);return;}
 const groups=new Map();filtered.forEach(r=>{if(!groups.has(r.category))groups.set(r.category,[]);groups.get(r.category).push(r)});
 groups.forEach((items,name)=>{
  const section=document.createElement('section');section.className='group';
  const heading=document.createElement('h2');heading.textContent=name;section.append(heading);
  const cards=document.createElement('div');cards.className='cards';
  items.forEach(r=>{
   const a=document.createElement('a');a.className='card';a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';
   const title=document.createElement('strong');title.textContent=r.title;
   const desc=document.createElement('span');desc.className='desc';desc.textContent=r.description||'';
   const open=document.createElement('span');open.className='open';open.textContent='Open in new tab ↗';
   a.append(title,desc,open);cards.append(a);
  });section.append(cards);library.append(section);
 });
}
search.addEventListener('input',render);render();
</script>
</body></html>
